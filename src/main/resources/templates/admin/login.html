<!DOCTYPE html>

<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rhythmic Scholar Admin Portal - Login</title>
<script>
window.tailwind = window.tailwind || {};
window.tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                "outline-variant": "#c4c5d5", "secondary-container": "#2170e4",
                "surface-tint": "#3755c3", "tertiary": "#303539",
                "surface-container-low": "#eff4ff", "on-primary-container": "#a8b8ff",
                "background": "#f8f9ff", "on-secondary-container": "#fefcff",
                "on-tertiary-fixed-variant": "#43474b", "surface-container-lowest": "#ffffff",
                "primary-fixed-dim": "#b8c4ff", "on-tertiary": "#ffffff",
                "on-primary": "#ffffff", "on-secondary": "#ffffff",
                "on-surface-variant": "#444653", "surface": "#f8f9ff",
                "on-tertiary-fixed": "#171c1f", "surface-container": "#e5eeff",
                "surface-variant": "#d3e4fe", "on-primary-fixed-variant": "#173bab",
                "secondary-fixed-dim": "#adc6ff", "surface-bright": "#f8f9ff",
                "on-primary-fixed": "#001453", "surface-dim": "#cbdbf5",
                "on-secondary-fixed-variant": "#004395", "inverse-on-surface": "#eaf1ff",
                "on-background": "#0b1c30", "surface-container-highest": "#d3e4fe",
                "error": "#ba1a1a", "primary-container": "#1e40af",
                "inverse-primary": "#b8c4ff", "on-secondary-fixed": "#001a42",
                "tertiary-fixed-dim": "#c3c7cb", "secondary-fixed": "#d8e2ff",
                "secondary": "#0058be", "outline": "#757684",
                "surface-container-high": "#dce9ff", "on-error": "#ffffff",
                "tertiary-container": "#474c4f", "error-container": "#ffdad6",
                "tertiary-fixed": "#dfe3e7", "on-surface": "#0b1c30",
                "on-error-container": "#93000a", "on-tertiary-container": "#b8bcc0",
                "primary-fixed": "#dde1ff", "primary": "#00288e", "inverse-surface": "#213145"
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: {
                gutter: "1.5rem", "container-max-width": "1440px",
                "stack-md": "1rem", "stack-sm": "0.5rem",
                "margin-mobile": "1rem", "sidebar-width": "260px",
                "stack-lg": "1.5rem", "margin-desktop": "2rem"
            },
            fontFamily: {
                "body-sm": ["Noto Sans"], "data-table": ["Inter"],
                "display-lg": ["Noto Sans"], "title-sm": ["Noto Sans"],
                "body-md": ["Noto Sans"], "label-caps": ["Inter"], "headline-md": ["Noto Sans"]
            },
            fontSize: {
                "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                "data-table": ["14px", { lineHeight: "20px", fontWeight: "500" }],
                "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                "title-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }],
                "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }]
            }
        }
    }
};
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link th:href="@{/css/admin/common.css}" href="/css/admin/common.css" rel="stylesheet"/>
</head>
<body class="bg-surface-container-low min-h-screen flex flex-col items-center justify-center p-4">
<!-- Canvas (Main Content) -->
<main class="w-full max-w-[440px] flex flex-col gap-stack-lg">
<!-- Brand / Header -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center text-on-primary shadow-sm mb-2">
<span class="material-symbols-outlined ms-icon-32-filled">
                    school
                </span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Rhythmic Scholar</h1>
<p class="font-title-sm text-title-sm text-on-surface-variant">Admin Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-8 flex flex-col gap-stack-md">
<form class="flex flex-col gap-stack-lg" th:action="@{/admin/login}" method="post">
<div th:if="${error}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
<span th:text="${error}">Error</span>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="font-data-table text-data-table text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                            person
                        </span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-body-md text-on-surface outline-none" id="email" name="email" placeholder="admin@rhythmicscholar.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-data-table text-data-table text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                            lock
                        </span>
<input class="w-full pl-10 pr-10 py-3 rounded-lg border border-outline-variant bg-surface focus:bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-body-md text-on-surface outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors flex items-center" type="button">
<span class="material-symbols-outlined">
                                visibility_off
                            </span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container bg-surface cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-primary-container hover:text-primary transition-colors hover:underline" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary rounded-lg py-3 font-title-sm text-title-sm hover:bg-primary transition-colors shadow-sm flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined ms-icon-20">
                        arrow_forward
                    </span>
</button>
</form>
</div>
<!-- Footer -->
<div class="text-center mt-4">
<p class="font-body-sm text-body-sm text-outline">
                © 2024 Rhythmic Scholar. All rights reserved.
            </p>
</div>
</main>
</body></html>
