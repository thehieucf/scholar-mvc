<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Categories | Admin — Rhythmic Scholar</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <style>
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--admin-surface, #fff);
            border-radius: 14px; padding: 2rem;
            width: 100%; max-width: 520px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-box h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 1.25rem; display:flex; align-items:center; gap:6px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .form-grid .full { grid-column: 1 / -1; }
        .form-field { display: flex; flex-direction: column; gap: 0.3rem; }
        .form-field label { font-size: 0.78rem; font-weight: 600; color: var(--admin-text-muted, #64748b); }
        .form-field input, .form-field select, .form-field textarea {
            border: 1px solid var(--admin-border, #e2e8f0);
            border-radius: 7px; padding: 0.45rem 0.65rem;
            font-size: 0.875rem; font-family: inherit;
            color: var(--admin-text, #1e293b);
            background: var(--admin-bg, #f8fafc);
            transition: border-color 0.15s;
        }
        .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
            outline: none; border-color: var(--admin-primary, #1e40af);
        }
        .form-field textarea { resize: vertical; min-height: 64px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem; }
        .word-count-badge {
            display: inline-flex; align-items: center; gap: 3px;
            background: #eff6ff; color: #1d4ed8;
            border-radius: 999px; padding: 2px 10px;
            font-size: 0.78rem; font-weight: 600;
        }
        .popular-badge {
            display: inline-flex; align-items: center; gap: 3px;
            background: #fef9c3; color: #a16207;
            border-radius: 999px; padding: 2px 10px;
            font-size: 0.72rem; font-weight: 600;
        }
        .checkbox-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer; }
        .checkbox-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
    </style>
</head>
<body class="admin-body">

    <div th:replace="~{admin/layout-fragment :: sidebar('categories')}"></div>
    <div th:replace="~{admin/layout-fragment :: header('Manage Categories')}"></div>

    <div class="admin-main">
        <div class="admin-content">

            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;margin-bottom:0.25rem;">
                <div>
                    <h1 class="admin-page-title" style="margin-bottom:0.1rem;">Manage Categories</h1>
                    <p class="admin-page-subtitle"
                       th:text="${#lists.size(categories)} + ' categories in the system'">
                        All vocabulary categories
                    </p>
                </div>
                <button class="admin-btn admin-btn--primary" id="btnOpenAdd">
                    <span class="material-symbols-outlined" style="font-size:16px;">add</span>
                    Add Category
                </button>
            </div>

            <!-- Flash messages -->
            <div th:if="${success}"
                 style="background:#dcfce7;color:#15803d;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.875rem;"
                 th:text="${success}"></div>
            <div th:if="${error}"
                 style="background:#fee2e2;color:#b91c1c;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.875rem;"
                 th:text="${error}"></div>

            <div class="admin-table-card">
                <div class="admin-table-card__header">
                    <span class="admin-table-card__title"
                          th:text="${#lists.size(categories)} + ' categories total'">0 categories</span>
                </div>

                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name (EN)</th>
                            <th>Name (KR)</th>
                            <th>Icon</th>
                            <th>Color Theme</th>
                            <th>Popular</th>
                            <th>Words</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.id}">1</td>
                            <td style="font-weight:600;" th:text="${cat.nameEn}">Food</td>
                            <td th:text="${cat.nameKr}">음식</td>
                            <td>
                                <span class="material-symbols-outlined"
                                      style="font-size:1.3rem;vertical-align:middle;"
                                      th:text="${cat.iconName}">restaurant</span>
                            </td>
                            <td>
                                <span class="admin-badge admin-badge--user"
                                      style="font-size:0.72rem;text-transform:capitalize;"
                                      th:text="${cat.colorTheme}">emerald</span>
                            </td>
                            <td>
                                <span th:if="${cat.popular}" class="popular-badge">
                                    <span class="material-symbols-outlined" style="font-size:12px;">star</span> Popular
                                </span>
                                <span th:unless="${cat.popular}" style="color:#94a3b8;font-size:0.8rem;">—</span>
                            </td>
                            <td>
                                <span class="word-count-badge">
                                    <span class="material-symbols-outlined" style="font-size:13px;">book</span>
                                    <span th:text="${wordCountMap[cat.id] != null ? wordCountMap[cat.id] : 0}">0</span>
                                </span>
                            </td>
                            <td style="font-size:0.8rem;color:var(--admin-text-muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                                th:text="${cat.description != null ? cat.description : '—'}">—</td>
                            <td>
                                <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
                                    <!-- Edit: dùng data-* để tránh lỗi Thymeleaf inline JS -->
                                    <button type="button"
                                            class="admin-btn admin-btn--ghost admin-btn--sm btn-edit-cat"
                                            style="font-size:0.75rem;padding:0.25rem 0.6rem;"
                                            th:data-id="${cat.id}"
                                            th:data-name-en="${cat.nameEn}"
                                            th:data-name-kr="${cat.nameKr}"
                                            th:data-icon="${cat.iconName}"
                                            th:data-color="${cat.colorTheme}"
                                            th:data-popular="${cat.popular}"
                                            th:data-description="${cat.description != null ? cat.description : ''}">
                                        <span class="material-symbols-outlined" style="font-size:14px;">edit</span>
                                        Edit
                                    </button>
                                    <!-- Delete -->
                                    <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}"
                                          method="post"
                                          onsubmit="return confirm('Delete this category? This will fail if it still has words.')">
                                        <button type="submit"
                                                class="admin-btn admin-btn--danger admin-btn--sm"
                                                style="font-size:0.75rem;padding:0.25rem 0.6rem;">
                                            <span class="material-symbols-outlined" style="font-size:14px;">delete</span>
                                            Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="9" style="text-align:center;color:#94a3b8;padding:2rem;">No categories found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- ===== Add Category Modal ===== -->
    <div class="modal-overlay" id="addCategoryModal">
        <div class="modal-box">
            <h2>
                <span class="material-symbols-outlined">add_circle</span>
                Add New Category
            </h2>
            <form th:action="@{/admin/categories/add}" method="post">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Name (English) <span style="color:#ef4444">*</span></label>
                        <input type="text" name="nameEn" required placeholder="e.g. Food" />
                    </div>
                    <div class="form-field">
                        <label>Name (Korean) <span style="color:#ef4444">*</span></label>
                        <input type="text" name="nameKr" required placeholder="e.g. 음식" />
                    </div>
                    <div class="form-field">
                        <label>Icon Name (Material Symbol) <span style="color:#ef4444">*</span></label>
                        <input type="text" name="iconName" required placeholder="e.g. restaurant" />
                    </div>
                    <div class="form-field">
                        <label>Color Theme <span style="color:#ef4444">*</span></label>
                        <select name="colorTheme" required>
                            <option value="emerald">Emerald</option>
                            <option value="blue">Blue</option>
                            <option value="violet">Violet</option>
                            <option value="rose">Rose</option>
                            <option value="amber">Amber</option>
                            <option value="cyan">Cyan</option>
                            <option value="orange">Orange</option>
                            <option value="pink">Pink</option>
                        </select>
                    </div>
                    <div class="form-field full">
                        <label>Description</label>
                        <textarea name="description" placeholder="Short description (optional)"></textarea>
                    </div>
                    <div class="form-field full">
                        <label class="checkbox-row">
                            <input type="checkbox" name="isPopular" value="true" />
                            Mark as Popular
                        </label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="admin-btn admin-btn--ghost" id="btnCloseAdd">Cancel</button>
                    <button type="submit" class="admin-btn admin-btn--primary">
                        <span class="material-symbols-outlined" style="font-size:15px;">save</span>
                        Save Category
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Edit Category Modal ===== -->
    <div class="modal-overlay" id="editCategoryModal">
        <div class="modal-box">
            <h2>
                <span class="material-symbols-outlined">edit</span>
                Edit Category
            </h2>
            <form id="editCategoryForm" method="post">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Name (English) <span style="color:#ef4444">*</span></label>
                        <input type="text" id="editNameEn" name="nameEn" required />
                    </div>
                    <div class="form-field">
                        <label>Name (Korean) <span style="color:#ef4444">*</span></label>
                        <input type="text" id="editNameKr" name="nameKr" required />
                    </div>
                    <div class="form-field">
                        <label>Icon Name (Material Symbol) <span style="color:#ef4444">*</span></label>
                        <input type="text" id="editIconName" name="iconName" required />
                    </div>
                    <div class="form-field">
                        <label>Color Theme <span style="color:#ef4444">*</span></label>
                        <select id="editColorTheme" name="colorTheme" required>
                            <option value="emerald">Emerald</option>
                            <option value="blue">Blue</option>
                            <option value="violet">Violet</option>
                            <option value="rose">Rose</option>
                            <option value="amber">Amber</option>
                            <option value="cyan">Cyan</option>
                            <option value="orange">Orange</option>
                            <option value="pink">Pink</option>
                        </select>
                    </div>
                    <div class="form-field full">
                        <label>Description</label>
                        <textarea id="editDescription" name="description"></textarea>
                    </div>
                    <div class="form-field full">
                        <label class="checkbox-row">
                            <input type="checkbox" id="editIsPopular" name="isPopular" value="true" />
                            Mark as Popular
                        </label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="admin-btn admin-btn--ghost" id="btnCloseEdit">Cancel</button>
                    <button type="submit" class="admin-btn admin-btn--primary">
                        <span class="material-symbols-outlined" style="font-size:15px;">save</span>
                        Update Category
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var addModal  = document.getElementById('addCategoryModal');
        var editModal = document.getElementById('editCategoryModal');

        document.getElementById('btnOpenAdd').addEventListener('click', function() {
            addModal.classList.add('open');
        });
        document.getElementById('btnCloseAdd').addEventListener('click', function() {
            addModal.classList.remove('open');
        });
        addModal.addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('open');
        });

        document.getElementById('btnCloseEdit').addEventListener('click', function() {
            editModal.classList.remove('open');
        });
        editModal.addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('open');
        });

        // Wire up all Edit buttons via data-* attributes
        document.querySelectorAll('.btn-edit-cat').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id          = this.dataset.id;
                var nameEn      = this.dataset.nameEn;
                var nameKr      = this.dataset.nameKr;
                var icon        = this.dataset.icon;
                var color       = this.dataset.color;
                var popular     = this.dataset.popular === 'true';
                var description = this.dataset.description;

                document.getElementById('editCategoryForm').action = '/admin/categories/' + id + '/edit';
                document.getElementById('editNameEn').value      = nameEn;
                document.getElementById('editNameKr').value      = nameKr;
                document.getElementById('editIconName').value    = icon;
                document.getElementById('editColorTheme').value  = color;
                document.getElementById('editDescription').value = description;
                document.getElementById('editIsPopular').checked = popular;

                editModal.classList.add('open');
            });
        });
    </script>

</body>
</html>
