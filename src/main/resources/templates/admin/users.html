<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users | Admin — Rhythmic Scholar</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>
<body class="admin-body">

    <div th:replace="~{admin/layout-fragment :: sidebar('users')}"></div>
    <div th:replace="~{admin/layout-fragment :: header('Manage Users')}"></div>

    <div class="admin-main">
        <div class="admin-content">

            <h1 class="admin-page-title">Manage Users</h1>
            <p class="admin-page-subtitle">All registered accounts in the system</p>

            <!-- Flash messages -->
            <div th:if="${success}" style="background:#dcfce7;color:#15803d;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.875rem;"
                 th:text="${success}"></div>
            <div th:if="${error}" style="background:#fee2e2;color:#b91c1c;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.875rem;"
                 th:text="${error}"></div>

            <div class="admin-table-card">
                <div class="admin-table-card__header">
                    <span class="admin-table-card__title" th:text="${#lists.size(users)} + ' users'">0 users</span>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Level</th>
                            <th>Role</th>
                            <th>XP</th>
                            <th>Streak</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}">1</td>
                            <td>
                                <div style="display:flex;align-items:center;gap:0.5rem;">
                                    <img style="width:32px;height:32px;border-radius:50%;object-fit:cover;"
                                         th:src="${u.avatarUrl != null and !u.avatarUrl.isEmpty()}
                                                 ? ${u.avatarUrl}
                                                 : ${'https://ui-avatars.com/api/?name=' + u.fullName + '&background=1e40af&color=fff&size=32'}"
                                         alt="avatar" />
                                    <span th:text="${u.fullName}">Name</span>
                                </div>
                            </td>
                            <td th:text="${u.email}">email</td>
                            <td th:text="${u.currentLevel}">Beginner</td>
                            <td>
                                <span th:classappend="${u.role == 'ADMIN'} ? 'admin-badge--admin' : 'admin-badge--user'"
                                      class="admin-badge"
                                      th:text="${u.role}">USER</span>
                            </td>
                            <td th:text="${u.totalXp}">0</td>
                            <td th:text="${u.currentStreak}">0</td>
                            <td>
                                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                                    <!-- Reset Password -->
                                    <form th:action="@{/admin/users/{id}/reset-password(id=${u.id})}" method="post"
                                          onsubmit="return confirm('Reset this user\'s password to the default?')">
                                        <button type="submit" class="admin-btn admin-btn--ghost admin-btn--sm">
                                            <span class="material-symbols-outlined" style="font-size:14px;">lock_reset</span>
                                            Reset Password
                                        </button>
                                    </form>
                                    <!-- Delete -->
                                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                          onsubmit="return confirm('Are you sure you want to delete this user?')">
                                        <button type="submit" class="admin-btn admin-btn--danger admin-btn--sm">
                                            <span class="material-symbols-outlined" style="font-size:14px;">delete</span>
                                            Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="8" style="text-align:center;color:#94a3b8;padding:2rem;">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</body>
</html>
