<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Vocab Groups | Admin — Rhythmic Scholar</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <style>
        .admin-pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--admin-border);
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .admin-pagination__info { font-size: 0.8rem; color: var(--admin-text-muted); }
        .admin-pagination__pages { display: flex; align-items: center; gap: 0.25rem; }
        .admin-page-btn {
            min-width: 34px; height: 34px; padding: 0 0.5rem;
            border-radius: 6px; border: 1px solid var(--admin-border);
            background: var(--admin-surface); color: var(--admin-text);
            font-size: 0.8rem; font-weight: 500; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            text-decoration: none; transition: background 0.15s, border-color 0.15s;
        }
        .admin-page-btn:hover:not(.disabled):not(.active) { background: #f1f5f9; border-color: #cbd5e1; }
        .admin-page-btn.active { background: var(--admin-primary); border-color: var(--admin-primary); color: #fff; font-weight: 700; cursor: default; }
        .admin-page-btn.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .admin-page-btn .material-symbols-outlined { font-size: 16px; }
        .admin-page-size { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--admin-text-muted); }
        .admin-page-size select { border: 1px solid var(--admin-border); border-radius: 6px; padding: 0.25rem 0.5rem; font-size: 0.8rem; color: var(--admin-text); background: var(--admin-surface); cursor: pointer; }
        .group-icon { font-size: 1.4rem; line-height: 1; }
        .word-count-badge {
            display: inline-flex; align-items: center; gap: 3px;
            background: #eff6ff; color: #1d4ed8;
            border-radius: 999px; padding: 2px 10px;
            font-size: 0.78rem; font-weight: 600;
        }
    </style>
</head>
<body class="admin-body">

    <div th:replace="~{admin/layout-fragment :: sidebar('vocab-groups')}"></div>
    <div th:replace="~{admin/layout-fragment :: header('Manage Vocab Groups')}"></div>

    <div class="admin-main">
        <div class="admin-content">

            <h1 class="admin-page-title">Manage Vocab Groups</h1>
            <p class="admin-page-subtitle"
               th:text="'Showing ' + ${groupPage.numberOfElements} + ' of ' + ${totalElements} + ' groups'">
                All user-created vocabulary groups
            </p>

            <!-- Flash messages -->
            <div th:if="${success}" style="background:#dcfce7;color:#15803d;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.875rem;"
                 th:text="${success}"></div>
            <div th:if="${error}" style="background:#fee2e2;color:#b91c1c;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.875rem;"
                 th:text="${error}"></div>

            <div class="admin-table-card">

                <div class="admin-table-card__header">
                    <span class="admin-table-card__title"
                          th:text="${totalElements} + ' groups total'">0 groups</span>
                    <div class="admin-page-size">
                        <span>Rows per page:</span>
                        <select onchange="changePageSize(this.value)">
                            <option th:value="10"  th:selected="${pageSize == 10}">10</option>
                            <option th:value="15"  th:selected="${pageSize == 15}">15</option>
                            <option th:value="25"  th:selected="${pageSize == 25}">25</option>
                            <option th:value="50"  th:selected="${pageSize == 50}">50</option>
                        </select>
                    </div>
                </div>

                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Icon</th>
                            <th>Group Name</th>
                            <th>Owner</th>
                            <th>Color Theme</th>
                            <th>Words</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="g : ${groupPage.content}">
                            <td th:text="${g.id}">1</td>
                            <td class="group-icon" th:text="${g.iconEmoji != null ? g.iconEmoji : '📚'}">📚</td>
                            <td style="font-weight:600;" th:text="${g.name}">Group Name</td>
                            <td th:text="${ownerNameMap[g.id] != null ? ownerNameMap[g.id] : 'User #' + g.userId}">User</td>
                            <td>
                                <span class="admin-badge admin-badge--user"
                                      style="font-size:0.72rem;text-transform:capitalize;"
                                      th:text="${g.colorTheme != null ? g.colorTheme : 'default'}">emerald</span>
                            </td>
                            <td>
                                <span class="word-count-badge">
                                    <span class="material-symbols-outlined" style="font-size:13px;">book</span>
                                    <span th:text="${wordCountMap[g.id] != null ? wordCountMap[g.id] : 0}">0</span>
                                </span>
                            </td>
                            <td style="font-size:0.8rem;color:var(--admin-text-muted);"
                                th:text="${g.createdAt != null ? #temporals.format(g.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
                            <td>
                                <form th:action="@{/admin/vocab-groups/{id}/delete(id=${g.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this group and all its words?')">
                                    <button type="submit"
                                            class="admin-btn admin-btn--danger admin-btn--sm"
                                            style="font-size:0.75rem;padding:0.25rem 0.6rem;">
                                        <span class="material-symbols-outlined" style="font-size:14px;">delete</span>
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${groupPage.numberOfElements == 0}">
                            <td colspan="8" style="text-align:center;color:#94a3b8;padding:2rem;">No vocab groups found.</td>
                        </tr>
                    </tbody>
                </table>

                <!-- Pagination controls -->
                <div class="admin-pagination" th:if="${totalPages > 1}">
                    <span class="admin-pagination__info"
                          th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">
                        Page 1 of 1
                    </span>
                    <div class="admin-pagination__pages">
                        <a th:href="@{/admin/vocab-groups(page=0, size=${pageSize})}"
                           th:classappend="${currentPage == 0} ? ' disabled' : ''"
                           class="admin-page-btn" title="First page">
                            <span class="material-symbols-outlined">first_page</span>
                        </a>
                        <a th:href="@{/admin/vocab-groups(page=${currentPage - 1}, size=${pageSize})}"
                           th:classappend="${currentPage == 0} ? ' disabled' : ''"
                           class="admin-page-btn" title="Previous page">
                            <span class="material-symbols-outlined">chevron_left</span>
                        </a>
                        <th:block th:with="
                            startPage=${T(java.lang.Math).max(0, currentPage - 2)},
                            endPage=${T(java.lang.Math).min(totalPages - 1, currentPage + 2)}">
                            <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
                               th:href="@{/admin/vocab-groups(page=${i}, size=${pageSize})}"
                               th:text="${i + 1}"
                               th:classappend="${i == currentPage} ? ' active' : ''"
                               class="admin-page-btn">1</a>
                        </th:block>
                        <a th:href="@{/admin/vocab-groups(page=${currentPage + 1}, size=${pageSize})}"
                           th:classappend="${currentPage + 1 >= totalPages} ? ' disabled' : ''"
                           class="admin-page-btn" title="Next page">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </a>
                        <a th:href="@{/admin/vocab-groups(page=${totalPages - 1}, size=${pageSize})}"
                           th:classappend="${currentPage + 1 >= totalPages} ? ' disabled' : ''"
                           class="admin-page-btn" title="Last page">
                            <span class="material-symbols-outlined">last_page</span>
                        </a>
                    </div>
                </div>

            </div><!-- /.admin-table-card -->

        </div>
    </div>

    <script th:inline="javascript">
        function changePageSize(size) {
            window.location.href = '/admin/vocab-groups?page=0&size=' + size;
        }
    </script>

</body>
</html>
