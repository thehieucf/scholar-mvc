# =============================================================================
# Cấu hình ứng dụng Scholar MVC
# Đây là file cấu hình trung tâm của Spring Boot.
# Spring Boot sẽ đọc file này khi khởi động và áp dụng toàn bộ các thiết lập.
# =============================================================================

spring.application.name=scholar-mvc

# =============================================================================
# Cấu hình Database (MySQL)
# Thay đổi username/password/port cho phù hợp với môi trường của bạn.
# =============================================================================

# JDBC URL: jdbc:mysql://<host>:<port>/<database>?<options>
#   useSSL=false              — tắt SSL (không cần thiết khi phát triển local)
#   serverTimezone=UTC        — chuẩn hóa múi giờ để tránh lỗi thời gian
#   allowPublicKeyRetrieval=true — cần thiết với MySQL 8.x khi không dùng SSL
spring.datasource.url=jdbc:mysql://localhost:3306/rhythmic_scholar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# Cấu hình JPA / Hibernate
# =============================================================================

# ddl-auto=update: Hibernate tự động tạo/cập nhật bảng dựa trên các @Entity.
# Trong production nên đổi thành "validate" hoặc "none" để tránh mất dữ liệu.
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu SQL thực thi lên console — hữu ích khi debug.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Giữ JPA session mở trong suốt HTTP request.
# Điều này giúp Thymeleaf có thể truy cập các quan hệ LAZY mà không cần
# gọi fetch trước (tránh LazyInitializationException trong template).
# Trong production quy mô lớn, nên tắt và dùng DTO thay thế.
spring.jpa.open-in-view=true

# =============================================================================
# Cấu hình Logging
# Các level: TRACE < DEBUG < INFO < WARN < ERROR
# =============================================================================

# Giảm log nhiễu của Hibernate và Spring Web xuống WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
# Bật DEBUG cho package của ứng dụng để dễ theo dõi trong quá trình phát triển
logging.level.com.rhythmicscholar=DEBUG
# Bật DEBUG cho Thymeleaf để xem lỗi render template chi tiết hơn
logging.level.org.thymeleaf=DEBUG

# =============================================================================
# Cấu hình Thymeleaf (Template Engine)
# =============================================================================

# Tắt cache template — đảm bảo mỗi request render lại template mới nhất.
# Trong production nên bật lại (spring.thymeleaf.cache=true) để tăng hiệu năng.
spring.thymeleaf.cache=false

# =============================================================================
# Cấu hình i18n (Internationalization — Đa ngôn ngữ)
# =============================================================================

# Tên file properties chứa các message đa ngôn ngữ (messages.properties, messages_vi.properties, v.v.)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Không dùng locale hệ thống làm fallback — luôn dùng messages.properties (tiếng Anh)
spring.messages.fallback-to-system-locale=false

# =============================================================================
# Cấu hình Jackson (JSON Serialization)
# =============================================================================

# Không báo lỗi khi serialize bean rỗng (tránh lỗi khi trả về entity chưa load hết field)
spring.jackson.serialization.fail-on-empty-beans=false

# =============================================================================
# Cấu hình Tomcat
# =============================================================================

# Tăng kích thước buffer HTTP response header lên 64KB.
# Mặc định ~8KB có thể không đủ với các trang có nhiều dữ liệu,
# gây lỗi "response already committed" khi Thymeleaf render template lớn.
server.tomcat.max-http-response-header-size=65536
