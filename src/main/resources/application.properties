spring.application.name=scholar-mvc

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/rhythmic_scholar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Giữ JPA session mở trong suốt HTTP request (tránh LazyInitializationException trong Thymeleaf)
spring.jpa.open-in-view=true

# Logging để bắt exception gốc
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.level.com.rhythmicscholar=DEBUG
logging.level.org.thymeleaf=DEBUG

# Thymeleaf Settings
spring.thymeleaf.cache=false

# i18n / Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Jackson Settings
spring.jackson.serialization.fail-on-empty-beans=false

# Tăng buffer size cho Tomcat để tránh lỗi "response already committed"
# khi exception xảy ra giữa quá trình render Thymeleaf template lớn
server.tomcat.max-http-response-header-size=65536
