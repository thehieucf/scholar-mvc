# ============================================================
# messages.properties — Ngôn ngữ mặc định: Tiếng Anh (English)
# ============================================================
#
# Đây là file i18n (internationalization) chứa tất cả chuỗi văn bản
# hiển thị trên giao diện ứng dụng bằng tiếng Anh.
#
# Cách hoạt động:
#   - Khi người dùng chọn ngôn ngữ tiếng Anh (lang=en hoặc mặc định),
#     Spring sẽ đọc từ file này.
#   - Khi người dùng chọn tiếng Việt (lang=vi),
#     Spring sẽ đọc từ messages_vi.properties thay thế.
#   - Trong template Thymeleaf, dùng cú pháp: #{key.name}
#     Ví dụ: #{login.heading} → "Sign In"
#
# Quy tắc đặt tên key:
#   <tên_trang>.<phần_tử>.<mô_tả>
#   Ví dụ: login.label.email, register.btn.submit, common.dashboard
#
# Ký tự đặc biệt:
#   {0}, {1} — tham số động, ví dụ: {0} words → "10 words"
#   \uXXXX  — Unicode escape, ví dụ: \u0026 = &
# ============================================================

